<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Карта с точками</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <!-- MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <!-- Date Picker CSS (flatpickr) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <!-- noUiSlider CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.css">

  <style>
    body { margin: 0; }
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: white;
      padding: 10px;
      border-radius: 8px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    .slider-label {
      margin-top: 10px;
    }
    #sumSlider {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h4>Фильтры</h4>
    <div>
      <label for="fenceTypeSelect">Вид Забора:</label>
      <div id="fenceTypeSelect"></div>
    </div>
    <div class="slider-label">
      <label for="modelRangeSelect">Модельный ряд:</label>
      <div id="modelRangeSelect"></div>
    </div>
    <div class="slider-label">
      <label for="colorSelect">Цвет:</label>
      <div id="colorSelect"></div>
    </div>
    <div class="slider-label">
      <label for="coatingSelect">Покрытие:</label>
      <div id="coatingSelect"></div>
    </div>
    <div class="slider-label">
      <label>Метраж:</label>
      <div id="meterSlider"></div>
      <div style="margin-top:6px;display:flex;gap:6px;align-items:center;">
        <input id="meterMinValue" type="text" readonly style="width:90px;" placeholder="от" />
        <input id="meterMaxValue" type="text" readonly style="width:90px;" placeholder="до" />
      </div>
    </div>
    <div class="slider-label">
      <label for="directionSelect">Направление:</label>
      <div id="directionSelect"></div>
    </div>
    <div class="slider-label">
      <label for="loyaltySelect">Лояльность:</label>
      <div id="loyaltySelect"></div>
    </div>
    <div class="slider-label">
      <label for="sourceSelect">Источник обращения:</label>
      <div id="sourceSelect"></div>
    </div>
    <div class="slider-label">
      <label for="monolithSelect">Монолит:</label>
      <div id="monolithSelect"></div>
    </div>
    <div class="slider-label">
      <label><input type="checkbox" id="hideUnfiltered" /> Скрыть неотфильтрованные точки</label>
    </div>
    <div class="slider-label">
      <label for="datePicker">Дата установки:</label>
      <input type="text" id="datePicker" placeholder="Выберите дату или диапазон" />
    </div>
    <div class="slider-label">
      <label>Сумма:</label>
      <div id="sumSlider"></div>
      <div id="sumValues"></div>
    </div>
    <button id="applyFilters" style="margin-top:10px;">Применить фильтры</button>
    <button id="resetFilters" style="margin-top:5px;">Сбросить фильтры</button>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
  <!-- flatpickr JS -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
  <!-- noUiSlider JS -->
  <script src="https://cdn.jsdelivr.net/npm/nouislider@15.7.1/dist/nouislider.min.js"></script>

  <script>
    let geojsonData;
    // Настройки кластеризации: maxClusterRadius — радиус кластера в пикселях, disableClusteringAtZoom — зум, на котором кластеры распадаются
    let markers = L.markerClusterGroup({
      maxClusterRadius: 80, // радиус кластера в пикселях (по умолчанию 80)
      disableClusteringAtZoom: 12 // на этом зуме и выше кластеры не формируются
    });
    const map = L.map('map').setView([55.7, 37.5], 9);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);
fetch('full.json')
  .then(res => res.json())
  .then(data => {
    geojsonData = data;

    // ← вот сюда вставь блок выше
    geojsonData.features.forEach(f => {
      let coords = f.geometry.coordinates;

      if (typeof coords === "string") {
        // Старый формат: "55.645870, 36.560000"
        coords = coords.replace(/[^\d.,\s-]/g, '');
        const parts = coords.split(',').map(s => parseFloat(s.trim()));
        if (
          parts.length === 2 &&
          !isNaN(parts[0]) &&
          !isNaN(parts[1]) &&
          parts[0] >= -90 && parts[0] <= 90 &&
          parts[1] >= -180 && parts[1] <= 180
        ) {
          f.geometry.coordinates = [parts[1], parts[0]];
        } else {
          f.geometry = null;
        }
      } else if (Array.isArray(coords) && coords.length === 2) {
        // Новый формат: [55.645870, 36.560000]
        if (
          !isNaN(coords[0]) &&
          !isNaN(coords[1]) &&
          coords[0] >= -90 && coords[0] <= 90 &&
          coords[1] >= -180 && coords[1] <= 180
        ) {
          // Leaflet ждет [lat, lng], GeoJSON — [lng, lat]
          f.geometry.coordinates = [coords[1], coords[0]];
        } else {
          f.geometry = null;
        }
      } else {
        f.geometry = null;
      }
    });


    initFilters();
    drawMarkers(geojsonData.features);
  });


    function initFilters() {
      initFenceTypeFilter();
      initModelRangeFilter();
      initGenericCheckboxFilter("Цвет", "colorSelect");
      initGenericCheckboxFilter("Покрытие", "coatingSelect");
      initGenericCheckboxFilter("Направление", "directionSelect");
      initGenericCheckboxFilter("Лояльность", "loyaltySelect");
      initGenericCheckboxFilter("ИсточникОбращения", "sourceSelect");
      initGenericCheckboxFilter("Монолит", "monolithSelect");
      initDatePicker();
      initSumSlider();
      initMeterSlider();

      document.getElementById("applyFilters").addEventListener("click", applyFilters);
      document.getElementById("resetFilters").addEventListener("click", resetFilters);
    }

    function initFenceTypeFilter() {
      const fenceTypes = new Set();
      geojsonData.features.forEach(f => {
        const type = f.properties["ВидЗабора"];
        if (type) fenceTypes.add(type);
      });

      const container = document.getElementById("fenceTypeSelect");
      fenceTypes.forEach(type => {
        const id = `chk_${type.replace(/\s+/g, '_')}`;
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" id="${id}" value="${type}"> ${type}<br>`;
        container.appendChild(label);
      });
    }

    function initModelRangeFilter() {
      const models = new Set();
      geojsonData.features.forEach(f => {
        const v = f.properties["МодельныйРяд"];
        if (v) models.add(v);
      });
      const container = document.getElementById("modelRangeSelect");
      models.forEach(v => {
        const id = `chk_model_${String(v).replace(/\s+/g, '_')}`;
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" id="${id}" value="${v}"> ${v}<br>`;
        container.appendChild(label);
      });
    }

    function initGenericCheckboxFilter(propName, containerId) {
      const set = new Set();
      geojsonData.features.forEach(f => {
        const v = f.properties[propName];
        if (v !== undefined && v !== null && String(v).trim() !== "") set.add(v);
      });
      const container = document.getElementById(containerId);
      set.forEach(v => {
        const id = `chk_${containerId}_${String(v).replace(/\s+/g, '_')}`;
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" id="${id}" value="${v}"> ${v}<br>`;
        container.appendChild(label);
      });
    }

    function initDatePicker() {
      flatpickr("#datePicker", {
        mode: "range",
        dateFormat: "d.m.Y",
        locale: "ru"
      });
    }

    let minSum = 0, maxSum = 0;
    function initSumSlider() {
      const sums = geojsonData.features.map(f => parseFloat(f.properties["Сумма"])).filter(Boolean);
      minSum = Math.min(...sums);
      maxSum = Math.max(...sums);

      const slider = document.getElementById('sumSlider');
      noUiSlider.create(slider, {
        start: [minSum, maxSum],
        connect: true,
        step: 1000,
        range: {
          'min': minSum,
          'max': maxSum
        },
        tooltips: true,
        format: {
          to: value => Math.round(value),
          from: value => Number(value)
        }
      });

      const sumValues = document.getElementById('sumValues');
      slider.noUiSlider.on('update', (values) => {
        sumValues.textContent = `От ${Math.round(values[0])} руб. до ${Math.round(values[1])} руб.`;
      });
    }

    let minMeter = 0, maxMeter = 0;
    function initMeterSlider() {
      const meters = geojsonData.features
        .map(f => parseFloat(f.properties["Метраж"]))
        .filter(v => !isNaN(v));
      if (meters.length === 0) {
        minMeter = 0; maxMeter = 0;
        const minInput = document.getElementById('meterMinValue');
        const maxInput = document.getElementById('meterMaxValue');
        if (minInput) minInput.value = '';
        if (maxInput) maxInput.value = '';
        return;
      }
      minMeter = Math.min(...meters);
      maxMeter = Math.max(...meters);

      const slider = document.getElementById('meterSlider');
      noUiSlider.create(slider, {
        start: [minMeter, maxMeter],
        connect: true,
        step: 1,
        range: { 'min': minMeter, 'max': maxMeter },
        tooltips: true,
        format: {
          to: value => Math.round(value),
          from: value => Number(value)
        }
      });
      const minInput = document.getElementById('meterMinValue');
      const maxInput = document.getElementById('meterMaxValue');
      slider.noUiSlider.on('update', (values) => {
        if (minInput) minInput.value = `${Math.round(values[0])}`;
        if (maxInput) maxInput.value = `${Math.round(values[1])}`;
      });
    }

    // Функция для генерации цветов для выбранных типов забора
    function generateTypeColors(types) {
      const colors = {};
      const n = types.length;
      for (let i = 0; i < n; i++) {
        // HSL: равномерно по кругу, насыщенность и яркость фиксированные
        colors[types[i]] = `hsl(${Math.round(360 * i / n)}, 80%, 45%)`;
      }
      return colors;
    }

    function applyFilters() {
      const selectedTypes = Array.from(document.querySelectorAll("#fenceTypeSelect input:checked")).map(cb => cb.value);
      const selectedModels = Array.from(document.querySelectorAll("#modelRangeSelect input:checked")).map(cb => cb.value);
      const selectedColors = Array.from(document.querySelectorAll("#colorSelect input:checked")).map(cb => cb.value);
      const selectedCoatings = Array.from(document.querySelectorAll("#coatingSelect input:checked")).map(cb => cb.value);
      const selectedDirections = Array.from(document.querySelectorAll("#directionSelect input:checked")).map(cb => cb.value);
      const selectedLoyalties = Array.from(document.querySelectorAll("#loyaltySelect input:checked")).map(cb => cb.value);
      const selectedSources = Array.from(document.querySelectorAll("#sourceSelect input:checked")).map(cb => cb.value);
      const selectedMonoliths = Array.from(document.querySelectorAll("#monolithSelect input:checked")).map(cb => cb.value);

      const dateRange = document.getElementById("datePicker").value;
      let startDate = null, endDate = null;
      if (dateRange) {
        const dates = dateRange.split(" до ");
        if (dates.length === 1) {
          startDate = endDate = parseDate(dates[0]);
        } else if (dates.length === 2) {
          startDate = parseDate(dates[0]);
          endDate = parseDate(dates[1]);
        }
      }

      const sumSlider = document.getElementById('sumSlider').noUiSlider.get();
      const minSelectedSum = parseFloat(sumSlider[0]);
      const maxSelectedSum = parseFloat(sumSlider[1]);

      let minSelectedMeter = null, maxSelectedMeter = null;
      const meterSliderEl = document.getElementById('meterSlider');
      if (meterSliderEl && meterSliderEl.noUiSlider) {
        const meterRange = meterSliderEl.noUiSlider.get();
        minSelectedMeter = parseFloat(meterRange[0]);
        maxSelectedMeter = parseFloat(meterRange[1]);
      }

      const filtered = geojsonData.features.filter(f => {
        const props = f.properties;

        if (startDate) {
          const installDate = parseDate(props["ДатаУстановки"]);
          if (!installDate) return false;
          if (installDate < startDate) return false;
          if (endDate && installDate > endDate) return false;
        }

        const sum = parseFloat(props["Сумма"]);
        if (sum < minSelectedSum || sum > maxSelectedSum) return false;

        if (minSelectedMeter !== null && maxSelectedMeter !== null) {
          const meter = parseFloat(props["Метраж"]);
          if (isNaN(meter) || meter < minSelectedMeter || meter > maxSelectedMeter) return false;
        }

        if (selectedModels.length > 0 && !selectedModels.includes(props["МодельныйРяд"])) return false;
        if (selectedColors.length > 0 && !selectedColors.includes(props["Цвет"])) return false;
        if (selectedCoatings.length > 0 && !selectedCoatings.includes(props["Покрытие"])) return false;
        if (selectedDirections.length > 0 && !selectedDirections.includes(props["Направление"])) return false;
        if (selectedLoyalties.length > 0 && !selectedLoyalties.includes(props["Лояльность"])) return false;
        if (selectedSources.length > 0 && !selectedSources.includes(props["ИсточникОбращения"])) return false;
        if (selectedMonoliths.length > 0 && !selectedMonoliths.includes(props["Монолит"])) return false;

        return true;
      });

      let typeColors = null;
      if (selectedTypes.length > 0) typeColors = generateTypeColors(selectedTypes);

      const hideUnfiltered = document.getElementById('hideUnfiltered') && document.getElementById('hideUnfiltered').checked;
      if (hideUnfiltered) {
        drawMarkers(filtered, typeColors, selectedTypes);
      } else {
        const filteredIdSet = new Set(filtered.map(f => f.properties && f.properties.id));
        drawMarkers(geojsonData.features, typeColors, selectedTypes, filteredIdSet);
      }
    }

    // drawMarkers теперь принимает selectedTypes и опционально filteredIdSet
    function drawMarkers(features, typeColors = null, selectedTypes = [], filteredIdSet = null) {
      markers.clearLayers();
      const geoJsonLayer = L.geoJSON(features, {
        pointToLayer: function (feature, latlng) {
          let color = '#3388ff'; // стандартный цвет Leaflet
          const fenceType = feature.properties["ВидЗабора"];
          const isFiltered = filteredIdSet ? filteredIdSet.has(feature.properties && feature.properties.id) : true;
          if (isFiltered && typeColors && fenceType && selectedTypes.includes(fenceType) && typeColors[fenceType]) {
            color = typeColors[fenceType];
          } else if (filteredIdSet && !isFiltered) {
            color = '#3388ff';
          }
          // divIcon с цветной точкой
          return L.divIcon ? L.marker(latlng, {
            icon: L.divIcon({
              className: 'custom-marker',
              html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 0 2px #000;"> </div>`
            })
          }) : L.marker(latlng);
        },
        onEachFeature: function (feature, layer) {
          const props = feature.properties;
          const popupContent = `
            <b>Номер заказа:</b> ${props["Номер"] || ''}<br/>
            <b>Бригада:</b> ${props["Бригада"] || ''}<br/>
            <b>Дата монтажа:</b> ${props["ДатаУстановки"] || ''}<br/>
            <b>Адрес:</b> ${props["АдресДоставки"] || ''}<br/>
            <b>Лояльность:</b> ${props["Лояльность"] || ''}<br/>
            <b>Источник:</b> ${props["ИсточникОбращения"] || ''}<br/>
            <hr/>
            <b>Тип:</b> ${props["ВидЗабора"] || ''}<br/>
            <b>Модель:</b> ${props["МодельныйРяд"] || ''}<br/>
            <b>Стоимость:</b> ${props["Сумма"] ? props["Сумма"] + ' руб.' : ''}<br/>
            <b>Цвет:</b> ${props["Цвет"] || ''}<br/>
            <b>Покрытие:</b> ${props["Покрытие"] || ''}<br/>
            <b>Метраж:</b> ${props["Метраж"] || ''}
          `;
          layer.bindPopup(popupContent);
        }
      });
      markers.addLayer(geoJsonLayer);
      map.addLayer(markers);
      if (features.length > 0) {
        map.fitBounds(markers.getBounds());
      }
    }

    // В resetFilters возвращаем стандартный цвет
    function resetFilters() {
      document.querySelectorAll("#fenceTypeSelect input").forEach(cb => cb.checked = false);
      ["modelRangeSelect","colorSelect","coatingSelect","directionSelect","loyaltySelect","sourceSelect","monolithSelect"].forEach(id => {
        document.querySelectorAll(`#${id} input`).forEach(cb => cb.checked = false);
      });
      document.getElementById("datePicker")._flatpickr.clear();
      document.getElementById("sumSlider").noUiSlider.set([minSum, maxSum]);
      const meterSliderEl = document.getElementById('meterSlider');
      if (meterSliderEl && meterSliderEl.noUiSlider) {
        const range = meterSliderEl.noUiSlider.options.range;
        meterSliderEl.noUiSlider.set([range.min, range.max]);
      }
      const hideEl = document.getElementById('hideUnfiltered');
      if (hideEl) hideEl.checked = false;
      drawMarkers(geojsonData.features, null, []);
    }

    function parseDate(dateStr) {
      if (!dateStr) return null;
      const parts = dateStr.split(".");
      if (parts.length !== 3) return null;
      return new Date(parts[2], parts[1] - 1, parts[0]);
    }
  </script>
</body>
</html>
